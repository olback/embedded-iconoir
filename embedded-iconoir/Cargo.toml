[package]
name = "embedded-iconoir"
version = "0.2.3"
edition = "2021"
license = "MIT"
authors = ["Yannik Bretschneider <me@yandrik.dev>"]
description = "1300+ icons for embedded-graphics, ported from the Iconoir icon pack"
readme = "../README.md"
repository = "https://github.com/Yandrik/embedded-iconoir"

[package.metadata.docs.rs]
all-features = true


[lib]

[[test]]
name = "render_test"
required-features = ["all-resolutions"]

[[bench]]
name = "bench_icons"
required-features = ["all-resolutions"]
harness = false

[features]
12px-regular = []
16px-regular = []
18px-regular = []
24px-regular = []
32px-regular = []
48px-regular = []
96px-regular = []
144px-regular = []
12px-solid = []
16px-solid = []
18px-solid = []
24px-solid = []
32px-solid = []
48px-solid = []
96px-solid = []
144px-solid = []

default = ["24px-regular"]
all-resolutions = [
    "12px-regular",
    "16px-regular",
    "18px-regular",
    "24px-regular",
    "32px-regular",
    "48px-regular",
    "96px-regular",
    "144px-regular",
    "12px-solid",
    "16px-solid",
    "18px-solid",
    "24px-solid",
    "32px-solid",
    "48px-solid",
    "96px-solid",
    "144px-solid",
]

[dependencies]
bit_field = "0.10"
embedded-graphics = "^0.8"
paste = "1.0"
static_assertions = "1.1"

[dev-dependencies]
anyhow = "1.0"
criterion = "0.4"
